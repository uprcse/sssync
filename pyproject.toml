[project]
name = "sssync"
version = "0.1.0"
description = "A scriptable playlist sync tool for Qobuz, Spotify, and Jellyfin"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "requests",
    "rapidfuzz",
    "spotipy",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
sssync = "sssync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sssync"]

[tool.hatch.version]
path = "sssync/__init__.py"

[tool.ruff]
line-length = 100
