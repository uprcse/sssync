[project]
name = "sssync"
version = "0.2.1"
description = "A scriptable playlist sync tool for Qobuz, Spotify, and Jellyfin"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "uppercase" }]
requires-python = ">=3.11"
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "click>=8.1",
    "requests",
    "rapidfuzz",
    "spotipy",
]

[project.urls]
Homepage = "https://github.com/uprcse/sssync"
Issues = "https://github.com/uprcse/sssync/issues"

[project.scripts]
sssync = "sssync.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sssync"]

[tool.hatch.version]
path = "sssync/__init__.py"

[tool.ruff]
line-length = 100
